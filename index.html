<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FPS shooter</title>
        <script type="module" src="/main.js"></script>
        <script type="module" src="/menu.js"></script>
        <link rel="stylesheet" href="/styles.css">

        <!-- fonts: -->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
        </head>

    <body>
        <div id="menu">
            <header>
                <h1 id="title" class="Hitmarker-bold">OFFENSIVE</h1>
            </header>
            <main class="Hitmarker-normal">
                <div id="log-in-menu">
                    <h1>Crie sua conta para guardar seu progresso</h1>
                    <button commandfor="new-account-prompt" command="show-modal" type="button" id="new-account">NOVA CONTA</button>
                    <button commandfor="log-in-prompt" command="show-modal" type="button" id="log-in">LOG-IN</button>

                    <dialog id="log-in-prompt">
                        <button commandfor="log-in-prompt" command="close" id="exit"></button>
                        <section>
                            <input id="username" placeholder="usuario">
                            <input id="password" type="senha" placeholder="password">
                            <button id="login-btn">Entrar</button>
                        </section>
                        <p id="message"></p>
                    </dialog>

                    <dialog id="new-account-prompt">
                        <button commandfor="new-account-prompt" command="close" id="exit"></button>
                        <section>
                            <input id="username-reg" placeholder="usuario">
                            <input id="password-reg" type="password" placeholder="senha">
                            <button id="register-btn">Registrar</button>
                        </section>    
                        <p id="message-reg"></p>
                    </dialog>
                </div>
                <section id="game-section" hidden>
                    <p>Logged in as <strong id="who"></strong></p>
                    <label>Level <input id="level" type="number" value="1"></label>
                    <label>Arma
                    <select id="weapon">
                        <option>pistola</option>
                        <option>shotgun</option>
                        <option>rifle</option>
                    </select>
                    </label>
                    <button id="save-btn">Salvar</button>
                    <button id="load-btn">Carregar</button>
                    <button id="logout-btn">Sair</button>
                </section>
                <br>
            </main>
        </div>
        <div id="blocker" class="dm-mono">
    <h1>Clique em qualquer lugar para iniciar o jogo</h1>
        </div>
        <div id="reticula"></div>
        <div id="UI" class="dm-mono">
            <p id="ammo-count">Ammo: </p>
        </div>
    </body>
</html>
